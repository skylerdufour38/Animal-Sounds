<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animal Sounds - App Store Package</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">A</span>
          <div>
            <p class="eyebrow">App Store Archive</p>
            <h1>Animal Sounds</h1>
          </div>
        </div>
      </header>

      <main class="content-grid">
        <section class="panel form-panel">
          <div class="panel-header">
            <h2>Create an App</h2>
            <span class="status-pill">Ready</span>
          </div>

          <form id="appForm">
            <div class="field-row">
              <label for="appName">App Name</label>
              <input id="appName" name="appName" type="text" value="Animal Sounds" />
            </div>

            <div class="field-row">
              <label for="bundleId">Bundle ID</label>
              <input id="bundleId" name="bundleId" type="text" value="com.smartbabyapps.animalsounds" />
            </div>

            <div class="field-row two-up">
              <div>
                <label for="version">Version</label>
                <input id="version" name="version" type="text" value="2.0" />
              </div>
              <div>
                <label for="platform">Platform</label>
                <select id="platform" name="platform">
                  <option value="iOS" selected>iOS</option>
                  <option value="macOS">macOS</option>
                  <option value="tvOS">tvOS</option>
                  <option value="watchOS">watchOS</option>
                </select>
              </div>
            </div>

            <div class="field-row two-up">
              <div>
                <label for="minimumOs">Minimum OS</label>
                <input id="minimumOs" name="minimumOs" type="text" value="3.1" />
              </div>
              <div>
                <label for="archiveType">Archive Type</label>
                <select id="archiveType" name="archiveType">
                  <option value="App Store Package" selected>App Store Package</option>
                  <option value="Ad Hoc">Ad Hoc</option>
                  <option value="Enterprise">Enterprise</option>
                  <option value="Development">Development</option>
                </select>
              </div>
            </div>

            <div class="field-row two-up">
              <div>
                <label for="ipaFile">IPA File</label>
                <input id="ipaFile" name="ipaFile" type="text" value="Animal Sounds 2.0.ipa" />
              </div>
              <div>
                <label for="fileSize">File Size</label>
                <input id="fileSize" name="fileSize" type="text" value="19.8 MB" />
              </div>
            </div>

            <div class="field-row">
              <label for="bundlePath">App Bundle Path</label>
              <input id="bundlePath" name="bundlePath" type="text" value="Payload/Animal Sounds.app" />
            </div>

            <button type="submit" class="primary-button">Create</button>
          </form>
        </section>

        <aside class="panel preview-panel">
          <div class="panel-header">
            <h2>App Information</h2>
            <span class="preview-badge">Preview</span>
          </div>

          <div class="app-preview">
            <div class="app-card">
              <div class="app-icon">A</div>
              <div class="app-meta">
                <h3 id="previewAppName">Animal Sounds</h3>
                <p id="previewBundleId">com.smartbabyapps.animalsounds</p>
              </div>
            </div>

            <dl class="info-list">
              <div class="info-item">
                <dt>Platform</dt>
                <dd id="previewPlatform">iOS</dd>
              </div>
              <div class="info-item">
                <dt>Version</dt>
                <dd id="previewVersion">2.0</dd>
              </div>
              <div class="info-item">
                <dt>Minimum OS</dt>
                <dd id="previewMinimumOs">3.1</dd>
              </div>
              <div class="info-item">
                <dt>IPA File</dt>
                <dd id="previewIpaFile">Animal Sounds 2.0.ipa</dd>
              </div>
              <div class="info-item">
                <dt>File Size</dt>
                <dd id="previewFileSize">19.8 MB</dd>
              </div>
              <div class="info-item">
                <dt>App Bundle Path</dt>
                <dd id="previewBundlePath">Payload/Animal Sounds.app</dd>
              </div>
              <div class="info-item">
                <dt>Archive Type</dt>
                <dd id="previewArchiveType">App Store Package</dd>
              </div>
            </dl>
          </div>
        </aside>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
